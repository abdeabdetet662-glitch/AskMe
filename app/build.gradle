plugins {
    id 'com.android.application'
}

android {
    namespace 'com.askme.ai'
    compileSdk 35

    defaultConfig {
        applicationId "com.askme.ai"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "GROQ_API_KEY", "\"${System.getenv('GROQ_API_KEY') ?: ''}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            storeFile file("../askme-release.keystore")
            storePassword "askme2026"
            keyAlias "askme"
            keyPassword "askme2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/NOTICE']
        }
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
